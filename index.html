<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> leonweb </title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+Antique&display=swap" rel="stylesheet">
  <link href="https://use.fontawesome.com/releases/v6.5.0/css/all.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/yusuke.css">
  <link rel="stylesheet" href="https://use.typekit.net/pds5jjd.css">
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="header__inner">
        <div class="header__title header-title">
            <h1 class="Versear">Versear</h1>
            <h1 class="middleline">関西大学総合情報学部<br>公認団体</h1>
        </div>
        <nav class="header__nav nav" id="js-nav">
          <ul class="nav__items nav-items">
            <li class="nav-items__item"><a href="#home">HOME</a></li>
            <li class="nav-items__item"><a href="#about">ABOUT</a></li>
            <li class="nav-items__item"><a href="#projects">PROJECTS</a></li>
            <input type="button" class="joinbtn" value="JOIN US">
          </ul>
        </nav>
        <button class="header__hamburger hamburger" id="js-hamburger">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main>
      <div class="home">
        <h1>共に学び、<br>共に高めあう</h1>
        <p>Versear Programing university club</p>
        <!-- <img class="title1" src="image/title_1.png" alt="title1"> -->
        <!-- <img class="title2" src="image/title_2.png" alt="title2"> -->
      </div>
      <!-- 擬似ホーム -->
      <div class="scrolldown" id="home">
        <h2>SCROLL DOWN</h2>
        <i class="fa-solid fa-angle-down"></i>
      </div>
      <div class="about area" id="about">
        <h2 class="title"><i class="fa-solid fa-terminal"></i>  ABOUT US</h2>
        <h1 class="subtitle">比較的新興の<br>プログラミングサークルです</h1>
        <p>versearは最高です。</p>
      </div>
      <div class="projects area" id="projects">
        <h1 class="title"><i class="fa-solid fa-code"></i> PROJECTS</h1>
        <h2 class="subtitle">活動内容</h2>
        <div class="contents">
          <div class="sur">
            <img class="pic" src="image/no_image.jpg" alt="no image">
          </div>
          <h3 class="date">2023.00.00</h3>
          <h4 class="minititle">タイトル</h4>
          <h5 class="sentence">ダミーの文章</h5>
        </div>
      </div>
      <div class="back">
      <div class="join" id="join">
        <div class="char">
          <h1 class="title">JOIN US</h1>
          <h2 class="subtitle">入会申込</h2>
          <h3>ダミーの文章</h3>
        </div>
        <div>
          <input type="button" class="nowbtn btn" value="今すぐ参加">
          <input type="button" class="checkbtn btn" value="活動場所を見る">
        </div>
      </div>
      </div>
    </main>
    <footer>
      <div>
        <i class="fa-brands fa-instagram"></i>
        <i class="fab fa-x-twitter"></i>
      </div>
    </footer>
  </div>
  <script src="main.js"></script>
</body>

</html>
